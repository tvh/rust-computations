[workspace]
resolver = "3"
members = ["crates/computations", "crates/computations-fs", "crates/computations-time"]

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
tracing = "0.1"
thiserror = "2"
notify = "8"
redb = "4"
smallvec = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tempfile = "3"
